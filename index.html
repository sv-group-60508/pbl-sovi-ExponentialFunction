<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F8F9FD">
<meta name="app-version" content="2026-08-20-audio-icons.1">
<title>Expo Flight · Sovi Growth Lab</title>
<link rel="icon" type="image/png" href="assets/brand/sovi-icon.png">
<link rel="apple-touch-icon" href="assets/brand/sovi-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="lvl-pill" id="lvlPill">Lesson 1/6</div>
    <div class="progress"><div class="fill" id="progFill"></div></div>
    <div class="xp-pill">⚡<span id="xpVal">0</span></div>
    <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">
      <svg class="ic ic-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.8 5.6 7 8.9H4.2c-.7 0-1.2.5-1.2 1.2v3.8c0 .7.5 1.2 1.2 1.2H7l3.8 3.3c.5.4 1.2.1 1.2-.5V6.1c0-.6-.7-.9-1.2-.5z" fill="currentColor"/>
        <path d="M15 9.3a4 4 0 0 1 0 5.4" stroke="#8D61EF" stroke-width="1.9"/>
        <path d="M17.4 7a7.2 7.2 0 0 1 0 10" stroke="#8D61EF" stroke-width="1.9"/>
      </svg>
      <svg class="ic ic-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.8 5.6 7 8.9H4.2c-.7 0-1.2.5-1.2 1.2v3.8c0 .7.5 1.2 1.2 1.2H7l3.8 3.3c.5.4 1.2.1 1.2-.5V6.1c0-.6-.7-.9-1.2-.5z" fill="currentColor"/>
        <path d="m15.2 9.8 5 5" stroke="#FF6B6B" stroke-width="1.9"/>
        <path d="m20.2 9.8-5 5" stroke="#FF6B6B" stroke-width="1.9"/>
      </svg>
    </button>
  </div>

  <div class="bubble-row">
    <div class="mascot" id="mascot">
      <img src="assets/brand/sovi-icon.png" alt="Sovi">
    </div>
    <div class="bubble" id="bubble"></div>
    <button type="button" class="ask-btn" id="askBtn">Hint</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="formula-pill" id="formulaPill"></div>
    <div class="collect-pill" id="collectPill">💎 0/3</div>
  </div>

  <div class="deck">
    <div class="deck-head">
      <span class="deck-title">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4" fill="#EAE4FD" stroke="#8D61EF" stroke-width="1.6"/>
          <path d="M6.2 16.8c4.6 0 5.2-9 11.6-9.6" stroke="#8D61EF" stroke-width="1.9"/>
          <circle cx="12.6" cy="11.2" r="2.15" fill="#fff" stroke="#31D6E7" stroke-width="1.7"/>
        </svg>
        Curve Console
      </span>
      <button class="reset-btn" id="resetBtn">↺ Reset</button>
    </div>
    <div class="param-scroll" id="paramScroll"></div>
    <div class="locked-row" id="lockedRow"></div>
    <button class="btn-launch" id="fireBtn">🚀 LAUNCH</button>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <div class="win-emoji">🏆</div>
      <div class="win-title">Mission Complete!</div>
      <div class="win-hint" id="winHint"></div>
      <div class="win-xp">+20 ⚡ XP</div>
      <button class="btn-next" id="nextBtn">Continue →</button>
    </div>
  </div>

</div>
<script defer src="assets/vendor/katex/katex.min.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
